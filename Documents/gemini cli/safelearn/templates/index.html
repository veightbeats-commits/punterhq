<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLearner.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CustomScrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111827;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script>
        // Pass backend session data to the frontend
        const session = JSON.parse('{{ session | tojson | safe }}');
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        const e = React.createElement;
        const { useState, useEffect } = React;

        const renderTextWithLinks = (text) => {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const parts = text.split(urlRegex);
            return parts.map((part, index) => {
                if (part.match(urlRegex)) {
                    return e('a', { key: index, href: part, target: '_blank', rel: 'noopener noreferrer', className: 'text-indigo-400 hover:underline' }, part);
                }
                return part;
            });
        };

        const Hero = () => {
            return e('div', {
                className: 'relative bg-gray-900 py-32 px-6 sm:py-40 sm:px-12 lg:px-16 border-b border-gray-800',
                style: {
                    backgroundImage: 'url(/static/hero-bg.jpg)',
                    backgroundSize: 'cover',
                    backgroundPosition: 'center',
                    backgroundRepeat: 'no-repeat'
                }
            },
                e('div', { className: 'absolute inset-0 bg-gray-900/70' }),
                e('div', { className: 'absolute inset-0 overflow-hidden' },
                    e('div', { className: 'absolute -top-40 -right-40 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob' }),
                    e('div', { className: 'absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000' })
                ),
                e('div', { className: 'relative z-10 text-center' },
                    e('h1', { className: 'text-5xl font-bold tracking-tight text-white sm:text-6xl lg:text-7xl mb-6' },
                        'Stay Informed, ', e('span', { className: 'gradient-text' }, 'Stay Ahead')
                    ),
                    e('p', { className: 'mt-6 max-w-2xl mx-auto text-xl text-gray-400' }, 'Your premium source for the latest news, updates, and insights in the South African education and skills development sector.')
                )
            );
        };

        const TabButton = ({ label, icon, activeTab, setActiveTab, tabName, isMobile, setIsMenuOpen }) => {
            const isActive = activeTab === tabName;
            const baseClasses = 'inline-flex items-center gap-2 whitespace-nowrap py-4 px-4 font-medium text-sm transition-all duration-200 rounded-lg mx-1';
            const mobileClasses = 'block w-full text-left';
            const desktopClasses = '';
            const activeClasses = 'bg-gray-800 text-white shadow-lg shadow-indigo-500/10 border border-gray-700';
            const inactiveClasses = 'text-gray-400 hover:text-white hover:bg-gray-800/50';

            return e('button', {
                onClick: () => {
                    setActiveTab(tabName);
                    if (isMobile && setIsMenuOpen) {
                        setIsMenuOpen(false);
                    }
                },
                className: `${baseClasses} ${isMobile ? mobileClasses : desktopClasses} ${isActive ? activeClasses : inactiveClasses}`
            }, e('i', { 'data-lucide': icon, className: `w-4 h-4 ${isActive ? 'text-indigo-400' : 'text-gray-500'}` }), label);
        };

        const SearchTab = ({ searchQuery, setSearchQuery }) => {
            return e('div', null,
                e('div', { className: 'relative' },
                    e('i', { 'data-lucide': 'search', className: 'absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500' }),
                    e('input', {
                        type: 'text',
                        placeholder: 'Search for qualifications, skills programmes, or schools by name or ID...',
                        value: searchQuery,
                        onChange: (e) => setSearchQuery(e.target.value),
                        className: 'w-full pl-12 pr-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all'
                    })
                )
            );
        };

        const VerifyTab = ({ schoolSearchQuery, setSchoolSearchQuery }) => {
            return e('div', null,
                e('div', { className: 'relative' },
                    e('i', { 'data-lucide': 'search', className: 'absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500' }),
                    e('input', {
                        type: 'text',
                        placeholder: 'Search for accredited schools by name or accreditation number...',
                        value: schoolSearchQuery,
                        onChange: (e) => setSchoolSearchQuery(e.target.value),
                        className: 'w-full pl-12 pr-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all'
                    })
                )
            );
        };

        const WelcomeVideoSections = ({ setActiveTab }) => {
            const sections = [
                {
                    id: 'welcome',
                    title: 'Welcome to SafeLearner.online',
                    description: 'Your comprehensive platform for educational excellence in South Africa. Discover qualifications, career paths, and opportunities tailored for you.',
                    image_url: '{{ url_for('static', filename='smarty/welcome.jpg') }}',
                    image_alt: 'Students in a classroom, welcoming new students',
                    icon: 'sparkles',
                    tabName: null // No navigation for welcome
                },
                {
                    id: 'search',
                    title: 'Search for Qualifications',
                    description: 'Use our powerful search tool to find qualifications and skills programmes. Search by name, SAQA ID, or browse by category and NQF level.',
                    image_url: '{{ url_for('static', filename='smarty/qualification.jpg') }}',
                    image_alt: 'Teacher presenting to students',
                    icon: 'search',
                    tabName: 'occupational_qualifications'
                },
                {
                    id: 'providers',
                    title: 'Find Training Providers',
                    description: 'Discover accredited schools, TVET colleges, and universities across all provinces. Verify accreditation and find contact details.',
                    image_url: '{{ url_for('static', filename='smarty/trainig providers.jpg') }}',
                    image_alt: 'Student reading a book',
                    icon: 'building',
                    tabName: 'training_providers'
                },
                {
                    id: 'career',
                    title: 'Career Guidance with "The Mind"',
                    description: 'Our AI-powered career guidance tool helps you explore career paths based on your interests, skills, and location. Get personalized recommendations.',
                    image_url: '{{ url_for('static', filename='smarty/career guidance with the mind.jpg') }}',
                    image_alt: 'People walking on different career paths, symbolizing career guidance',
                    icon: 'brain-circuit',
                    tabName: 'career_paths'
                },
                {
                    id: 'success',
                    title: 'Bursaries & Learnerships',
                    description: 'Access bursaries and learnerships to fund your education. Find opportunities that match your field of study and financial needs.',
                    image_url: '{{ url_for('static', filename='smarty/bursaries & learnerships.jpg') }}',
                    image_alt: 'Graduating students celebrating success',
                    icon: 'trophy',
                    tabName: 'bursaries'
                },
                {
                    id: 'community',
                    title: 'Latest News & Updates',
                    description: 'Read the latest news, share experiences, and connect with fellow learners. Stay updated with educational developments in South Africa.',
                    image_url: '{{ url_for('static', filename='smarty/latest news & updates.jpg') }}',
                    image_alt: 'Happy diverse group of students collaborating',
                    icon: 'newspaper',
                    tabName: 'news'
                },
                {
                    id: 'setas',
                    title: 'Explore SETAs & Industries',
                    description: 'Learn about Sector Education and Training Authorities. Find industry-specific qualifications and training opportunities.',
                    image_url: '{{ url_for('static', filename='smarty/96870987-c003-4f3e-90e4-a572260857c3.jpg') }}',
                    image_alt: 'Lightbulb over books, symbolizing ideas and innovation in education',
                    icon: 'briefcase',
                    tabName: 'setas'
                },
                {
                    id: 'accommodation',
                    title: 'Find Accommodation',
                    description: 'Search for student accommodation near your institution. Filter by province, payment options (NSFAS, Bursary, Cash), and monthly rates.',
                    image_url: '{{ url_for('static', filename='smarty/find accommodation.jpg') }}',
                    image_alt: 'Students relaxing in a modern student accommodation',
                    icon: 'home',
                    tabName: 'accommodation'
                },
                {
                    id: 'contact',
                    title: 'Get in Touch',
                    description: 'Have questions or need assistance? Send us a message and our team will get back to you as soon as possible.',
                    video: null, // No video for contact form
                    icon: 'mail',
                    tabName: null,
                    isContactForm: true
                }
            ];

            const handleSectionClick = (tabName) => {
                if (tabName) {
                    setActiveTab(tabName);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            return e('div', { className: 'space-y-0' },
                e('div', { className: 'text-center mb-12' },
                    e('h2', { className: 'text-4xl font-bold text-white mb-4' },
                        'How to Navigate ', e('span', { className: 'gradient-text' }, 'SafeLearner.online')
                    ),
                    e('p', { className: 'text-gray-400 text-lg max-w-3xl mx-auto' },
                        'Click on any section below to explore that feature'
                    )
                ),
                sections.map((section, index) => {
                    const isEven = index % 2 === 0;
                    const isClickable = section.tabName !== null;

                    // Special handling for contact form
                    if (section.isContactForm) {
                        return e('div', {
                            key: section.id,
                            className: 'bg-gradient-to-br from-gray-800 to-gray-900 border-b border-gray-700 py-16'
                        },
                            e('div', { className: 'max-w-4xl mx-auto px-8' },
                                e('div', { className: 'text-center mb-12' },
                                    e('div', { className: 'flex items-center justify-center gap-3 mb-4' },
                                        e('div', { className: 'p-3 bg-indigo-500/10 rounded-xl' },
                                            e('i', {
                                                'data-lucide': section.icon,
                                                className: 'w-8 h-8 text-indigo-400'
                                            })
                                        )
                                    ),
                                    e('h3', { className: 'text-4xl font-bold text-white mb-4' },
                                        section.title
                                    ),
                                    e('p', { className: 'text-gray-400 text-lg max-w-2xl mx-auto' },
                                        section.description
                                    )
                                ),
                                e(ContactForm)
                            )
                        );
                    }

                    return e('div', {
                        key: section.id,
                        onClick: () => handleSectionClick(section.tabName),
                        className: `grid grid-cols-1 lg:grid-cols-2 gap-0 border-b border-gray-700 ${isClickable ? 'cursor-pointer hover:bg-gray-800/50' : ''} transition-all duration-300 group`
                    },
                        // Video/Image section
                        e('div', {
                            className: `relative aspect-video bg-gray-900 ${isEven ? 'lg:order-1' : 'lg:order-2'}`
                        },
                            section.image_url && e('img', {
                                src: section.image_url,
                                alt: section.image_alt,
                                className: 'w-full h-full object-cover'
                            }),
                            isClickable && e('div', {
                                className: 'absolute inset-0 bg-indigo-600/0 group-hover:bg-indigo-600/10 transition-all duration-300 flex items-center justify-center'
                            },
                                e('div', { className: 'opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-white/90 rounded-full p-4' },
                                    e('i', { 'data-lucide': 'arrow-right', className: 'w-8 h-8 text-indigo-600' })
                                )
                            )
                        ),
                        // Content section
                        e('div', {
                            className: `flex flex-col justify-center p-8 lg:p-12 bg-gradient-to-br from-gray-800 to-gray-900 ${isEven ? 'lg:order-2' : 'lg:order-1'}`
                        },
                            e('div', { className: 'flex items-center gap-3 mb-4' },
                                e('div', { className: 'p-3 bg-indigo-500/10 rounded-xl group-hover:bg-indigo-500/20 transition-colors' },
                                    e('i', {
                                        'data-lucide': section.icon,
                                        className: 'w-6 h-6 text-indigo-400 group-hover:text-indigo-300 transition-colors'
                                    })
                                )
                            ),
                            e('h3', { className: 'text-3xl font-bold text-white mb-4 group-hover:text-indigo-300 transition-colors' },
                                section.title
                            ),
                            e('p', { className: 'text-gray-400 text-lg leading-relaxed mb-6' },
                                section.description
                            ),
                            isClickable && e('div', { className: 'flex items-center gap-2 text-indigo-400 font-semibold group-hover:gap-4 transition-all' },
                                e('span', null, 'Explore'),
                                e('i', { 'data-lucide': 'arrow-right', className: 'w-5 h-5' })
                            )
                        )
                    );
                })
            );
        };

        const ContactForm = () => {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                subject: '',
                message: ''
            });
            const [status, setStatus] = useState(''); // '', 'sending', 'success', 'error'

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('sending');

                fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        setStatus('success');
                        setFormData({ name: '', email: '', subject: '', message: '' });
                        setTimeout(() => setStatus(''), 5000);
                    } else {
                        setStatus('error');
                        setTimeout(() => setStatus(''), 5000);
                    }
                })
                .catch(error => {
                    console.error('Error submitting contact form:', error);
                    setStatus('error');
                    setTimeout(() => setStatus(''), 5000);
                });
            };

            const handleChange = (field, value) => {
                setFormData({ ...formData, [field]: value });
            };

            useEffect(() => {
                lucide.createIcons();
            }, [status]);

            return e('form', { onSubmit: handleSubmit, className: 'space-y-6' },
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                    e('div', null,
                        e('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Your Name'),
                        e('input', {
                            type: 'text',
                            required: true,
                            value: formData.name,
                            onChange: (e) => handleChange('name', e.target.value),
                            className: 'w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all',
                            placeholder: 'John Doe'
                        })
                    ),
                    e('div', null,
                        e('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Email Address'),
                        e('input', {
                            type: 'email',
                            required: true,
                            value: formData.email,
                            onChange: (e) => handleChange('email', e.target.value),
                            className: 'w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all',
                            placeholder: 'john@example.com'
                        })
                    )
                ),
                e('div', null,
                    e('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Subject'),
                    e('input', {
                        type: 'text',
                        required: true,
                        value: formData.subject,
                        onChange: (e) => handleChange('subject', e.target.value),
                        className: 'w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all',
                        placeholder: 'How can we help you?'
                    })
                ),
                e('div', null,
                    e('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Message'),
                    e('textarea', {
                        required: true,
                        rows: 6,
                        value: formData.message,
                        onChange: (e) => handleChange('message', e.target.value),
                        className: 'w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none',
                        placeholder: 'Tell us more about your inquiry...'
                    })
                ),
                status === 'success' && e('div', { className: 'bg-green-500/10 border border-green-500/50 rounded-lg p-4 flex items-center gap-3' },
                    e('i', { 'data-lucide': 'check-circle', className: 'w-5 h-5 text-green-400' }),
                    e('p', { className: 'text-green-400' }, 'Thank you! Your message has been sent successfully.')
                ),
                status === 'error' && e('div', { className: 'bg-red-500/10 border border-red-500/50 rounded-lg p-4 flex items-center gap-3' },
                    e('i', { 'data-lucide': 'alert-circle', className: 'w-5 h-5 text-red-400' }),
                    e('p', { className: 'text-red-400' }, 'Something went wrong. Please try again later.')
                ),
                e('button', {
                    type: 'submit',
                    disabled: status === 'sending',
                    className: `w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-bold rounded-lg transition-all duration-300 flex items-center justify-center gap-2 ${status === 'sending' ? '' : 'hover:shadow-lg hover:shadow-indigo-500/50'}`
                },
                    e('div', { className: `w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin ${status === 'sending' ? '' : 'hidden'}` }),
                    e('i', { 'data-lucide': 'send', className: `w-5 h-5 ${status === 'sending' ? 'hidden' : ''}` }),
                    status === 'sending' ? 'Sending...' : 'Send Message'
                )
            );
        };

        const NewsTab = ({ setActiveTab }) => {
            const [posts, setPosts] = useState([]);

            useEffect(() => {
                fetch('/api/posts')
                    .then(res => res.json())
                    .then(data => setPosts(data))
                    .catch(console.error);
            }, []);

            useEffect(() => {
                lucide.createIcons();
            }, [posts]);

            return e('div', { className: 'space-y-6' },
                e('div', { className: 'mb-8' },
                    e('h2', { className: 'text-3xl font-bold text-white mb-2 flex items-center gap-3' },
                        e('i', { 'data-lucide': 'newspaper', className: 'w-8 h-8 text-indigo-400' }),
                        'Latest News & Updates'
                    ),
                    e('p', { className: 'text-gray-400 text-lg' },
                        'Stay informed with the latest developments in South African education and skills development'
                    )
                ),
                posts.length > 0
                    ? posts.map(post => e(PostCard, { key: post.id, post }))
                    : e('div', { className: 'text-center py-12 bg-gray-800/30 rounded-xl border border-gray-700' },
                        e('i', { 'data-lucide': 'newspaper', className: 'w-16 h-16 mx-auto mb-4 text-gray-600' }),
                        e('p', { className: 'text-gray-500 text-lg' }, 'No news posts available yet.')
                    )
            );
        };

        const Comment = ({ comment, post, onCommentPosted }) => {
            const [showReplyForm, setShowReplyForm] = useState(false);
            const [reply, setReply] = useState('');

            const handleReplySubmit = (e) => {
                e.preventDefault();
                if (reply.trim()) {
                    fetch(`/api/posts/${post.id}/comment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comment: reply, parent_id: comment.id })
                    })
                        .then(() => {
                            setReply('');
                            setShowReplyForm(false);
                            onCommentPosted(); // Callback to refresh comments
                        })
                        .catch(console.error);
                }
            };

            return e('div', { className: 'ml-4 mt-2' },
                e('div', { className: 'text-sm bg-gray-700/50 p-3 rounded-lg border border-gray-700' },
                    e('div', { className: 'flex items-center gap-2 mb-2' },
                        e('i', { 'data-lucide': 'user-circle', className: 'w-4 h-4 text-indigo-400' }),
                        e('span', { className: 'font-semibold text-indigo-300 text-xs' }, comment.username || 'Anonymous')
                    ),
                    e('p', { className: 'text-gray-200' }, renderTextWithLinks(comment.comment)),
                    e('div', { className: 'flex items-center justify-between mt-2' },
                        e('span', { className: 'text-xs text-gray-500' }, new Date(comment.created_at).toLocaleString()),
                        e('button', { onClick: () => setShowReplyForm(!showReplyForm), className: 'text-xs font-semibold text-indigo-400 hover:text-indigo-300' }, 'Reply')
                    )
                ),
                showReplyForm && e('form', { onSubmit: handleReplySubmit, className: 'mt-2 ml-4' },
                    e('div', { className: 'flex items-center gap-2' },
                        e('input', {
                            type: 'text',
                            placeholder: 'Write a reply...',
                            value: reply,
                            onChange: (e) => setReply(e.target.value),
                            className: 'flex-grow p-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500'
                        }),
                        e('button', { type: 'submit', className: 'bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-3 rounded-lg transition-colors' }, 'Reply')
                    )
                ),
                comment.children && e('div', { className: 'ml-4 border-l border-gray-700 pl-2' },
                    comment.children.map(child => e(Comment, { key: child.id, comment: child, post, onCommentPosted }))
                )
            );
        }

        const PostCard = ({ post }) => {
            const [likes, setLikes] = useState(post.likes);
            const [comments, setComments] = useState([]);
            const [showComments, setShowComments] = useState(false);
            const [newComment, setNewComment] = useState('');

            const fetchComments = () => {
                fetch(`/api/posts/${post.id}/comments`)
                    .then(res => res.json())
                    .then(data => {
                        const commentsById = {};
                        data.forEach(comment => commentsById[comment.id] = { ...comment, children: [] });

                        const nestedComments = [];
                        data.forEach(comment => {
                            if (comment.parent_id && commentsById[comment.parent_id]) {
                                commentsById[comment.parent_id].children.push(commentsById[comment.id]);
                            } else {
                                nestedComments.push(commentsById[comment.id]);
                            }
                        });
                        setComments(nestedComments);
                    })
                    .catch(console.error);
            };

            useEffect(() => {
                if (showComments) {
                    fetchComments();
                }
            }, [showComments, post.id]);

            const handleLike = () => {
                const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
                if (!likedPosts.includes(post.id)) {
                    fetch(`/api/posts/${post.id}/like`, { method: 'POST' })
                        .then(() => {
                            setLikes(likes + 1);
                            localStorage.setItem('likedPosts', JSON.stringify([...likedPosts, post.id]));
                        })
                        .catch(console.error);
                } else {
                    alert('You have already liked this post.');
                }
            };

            const handleCommentSubmit = (e) => {
                e.preventDefault();
                if (newComment.trim()) {
                    fetch(`/api/posts/${post.id}/comment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comment: newComment })
                    })
                        .then(() => {
                            setNewComment('');
                            fetchComments(); // Refresh comments
                        })

        // --- Main App Component ---
        function App() {
            const [searchQuery, setSearchQuery] = useState('');
            const [schoolSearchQuery, setSchoolSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [schoolResults, setSchoolResults] = useState([]);
            const [activeTab, setActiveTab] = useState('news');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [userFavorites, setUserFavorites] = useState(new Set());
            const [showHomePage, setShowHomePage] = useState(true);

            // Track when user navigates away from homepage
            const handleTabChange = (newTab) => {
                setActiveTab(newTab);
                if (newTab !== 'news' || !showHomePage) {
                    setShowHomePage(false);
                }
            };

            useEffect(() => {
                if (session.user_id) {
                    fetch(`/api/users/${session.user_id}/favorites`)
                        .then(res => res.json())
                        .then(data => {
                            const newFavorites = new Set(data.map(f => `${f.item_type}_${f.item_id}`));
                            setUserFavorites(newFavorites);
                        })
                        .catch(console.error);
                }
            }, []);

            const toggleFavorite = (type, id) => {
                const key = `${type}_${id}`;
                const isFavorited = userFavorites.has(key);
                const method = isFavorited ? 'DELETE' : 'POST';
                const url = isFavorited ? `/api/favorites/${type}/${id}` : '/api/favorites';
                const body = isFavorited ? null : JSON.stringify({ item_type: type, item_id: id });

                return fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                })
                    .then(res => {
                        if (res.ok) {
                            setUserFavorites(prev => {
                                const next = new Set(prev);
                                if (isFavorited) next.delete(key);
                                else next.add(key);
                                return next;
                            });
                        } else {
                            if (res.status === 409) { // Already favorited conflict, just add to state
                                setUserFavorites(prev => new Set(prev).add(key));
                            } else {
                                throw new Error('Failed to update favorite');
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error toggling favorite:', error);
                        alert("Failed to update favorite. Please try again.");
                    });
            };

            // Debounce search queries
            useEffect(() => {
                const handler = setTimeout(() => {
                    if (searchQuery.trim()) {
                        fetch(`/api/search?q=${searchQuery}`)
                            .then(res => res.json())
                            .then(data => setSearchResults(data))
                            .catch(console.error);
                    } else {
                        setSearchResults([]);
                    }
                }, 300); // 300ms delay

                return () => {
                    clearTimeout(handler);
                };
            }, [searchQuery]);

            useEffect(() => {
                const handler = setTimeout(() => {
                    if (schoolSearchQuery.trim()) {
                        fetch(`/api/schools?q=${schoolSearchQuery}`)
                            .then(res => res.json())
                            .then(data => setSchoolResults(data))
                            .catch(console.error);
                    } else {
                        setSchoolResults([]);
                    }
                }, 300);

                return () => {
                    clearTimeout(handler);
                };
            }, [schoolSearchQuery]);

            const renderTabContent = () => {
                const props = { userFavorites, toggleFavorite };
                switch (activeTab) {
                    case 'search':
                    case 'verify':
                        return null; // Search bars are now above the hero
                    case 'accommodation':
                        return React.createElement(AccommodationTab, props);
                    case 'tvet_colleges':
                        return React.createElement(TvetCollegesTab, props);
                    case 'setas':
                        return React.createElement(SetasTab, props);
                    case 'news':
                        // Show homepage video sections on initial load, news posts when user clicks News button
                        return showHomePage
                            ? React.createElement(WelcomeVideoSections, { setActiveTab: handleTabChange })
                            : React.createElement(NewsTab, { setActiveTab: handleTabChange });
                    case 'career_paths':
                        return React.createElement(CareerPathsTab, props);
                    case 'materials':
                        return e('div', { className: 'p-8 bg-gray-800 border border-gray-700 rounded-xl shadow-lg animate-fadeIn' },
                            e('h2', { className: 'text-2xl font-bold mb-6 text-white flex items-center gap-2' },
                                e('i', { 'data-lucide': 'book-open', className: 'w-6 h-6 text-indigo-400' }), 'Learner Materials & Useful Links'
                            ),
                            e('ul', { className: 'space-y-4' },
                                e('li', { className: 'flex items-center gap-3 p-3 bg-gray-900/50 rounded-lg border border-gray-700/50 hover:bg-gray-700/50 transition-colors' },
                                    e('div', { className: 'bg-indigo-500/10 p-2 rounded-lg' },
                                        e('i', { 'data-lucide': 'globe', className: 'w-5 h-5 text-indigo-400' })
                                    ),
                                    e('a', { href: 'https://www.qcto.org.za/', target: '_blank', className: 'text-gray-300 hover:text-white font-medium transition-colors' }, 'Official QCTO Website')
                                ),
                                e('li', { className: 'flex items-center gap-3 p-3 bg-gray-900/50 rounded-lg border border-gray-700/50 hover:bg-gray-700/50 transition-colors' },
                                    e('div', { className: 'bg-indigo-500/10 p-2 rounded-lg' },
                                        e('i', { 'data-lucide': 'globe', className: 'w-5 h-5 text-indigo-400' })
                                    ),
                                    e('a', { href: 'https://www.saqa.org.za/', target: '_blank', className: 'text-gray-300 hover:text-white font-medium transition-colors' }, 'SAQA (South African Qualifications Authority)')
                                ),
                                e('li', { className: 'flex items-center gap-3 p-3 bg-gray-900/50 rounded-lg border border-gray-700/50 hover:bg-gray-700/50 transition-colors' },
                                    e('div', { className: 'bg-indigo-500/10 p-2 rounded-lg' },
                                        e('i', { 'data-lucide': 'globe', className: 'w-5 h-5 text-indigo-400' })
                                    ),
                                    e('a', { href: 'https://www.nsfas.org.za/', target: '_blank', className: 'text-gray-300 hover:text-white font-medium transition-colors' }, 'NSFAS (National Student Financial Aid Scheme)')
                                )
                            )
                        );
                    case 'bursaries':
                        return React.createElement(BursaryScholarshipTab, props);
                    case 'learnerships':
                        return React.createElement(LearnershipsTab, props);
                    case 'universities':
                        return React.createElement(UniversityTab, props);
                    case 'training_providers':
                        return React.createElement(TrainingProvidersTab, props);
                    case 'occupational_qualifications':
                        return React.createElement(OccupationalQualsTab, props);
                    default:
                        return null;
                }
            };

            const isCareerPathRelatedTab = ['career_paths', 'accommodation', 'tvet_colleges', 'setas', 'materials', 'profile', 'bursaries', 'learnerships', 'universities', 'training_providers', 'occupational_qualifications'].includes(activeTab);

            return e('div', { className: 'min-h-screen flex flex-col' },
                e(Header, { isMenuOpen, setIsMenuOpen, activeTab, setActiveTab: handleTabChange }),
                e(SubNav, { activeTab, setActiveTab: handleTabChange }),
                e('main', { className: 'flex-grow w-full' },
                    (activeTab === 'search' || activeTab === 'verify') && e('div', { className: 'bg-white py-8' },
                        e('div', { className: 'max-w-4xl mx-auto px-4 sm:px-6 lg:px-8' },
                            activeTab === 'search' ?
                                React.createElement(SearchTab, { searchQuery, setSearchQuery, userFavorites, toggleFavorite }) :
                                React.createElement(VerifyTab, { schoolSearchQuery, setSchoolSearchQuery, userFavorites, toggleFavorite }),

                            activeTab === 'search' ?
                                e(SearchResults, { results: searchResults, userFavorites, toggleFavorite }) :
                                e(SchoolResults, { results: schoolResults, userFavorites, toggleFavorite })
                        )
                    ),
                    !isMenuOpen && !isCareerPathRelatedTab && activeTab !== 'search' && activeTab !== 'verify' && showHomePage && e(Hero),
                    e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8' },
                        e('div', { className: 'mt-8' }, renderTabContent())
                    )
                ),
                e(Footer)
            );
        }

        const LucideIcon = ({ name, className }) => {
            if (!window.lucide || !window.lucide.icons || !window.lucide.icons[name]) {
                return e('i', { 'data-lucide': name, className });
            }
            const svgHtml = window.lucide.icons[name].toSvg({ class: className });
            return e('span', {
                dangerouslySetInnerHTML: { __html: svgHtml },
                className: "inline-flex items-center justify-center"
            });
        };

        const FavoriteButton = ({ type, id, isFavorited, onToggle }) => {
            const [loading, setLoading] = useState(false);

            const handleClick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.nativeEvent) e.nativeEvent.stopImmediatePropagation();

                if (loading) return;

                if (!session || !session.user_id) {
                    alert("Please login to save favorites.");
                    return;
                }

                setLoading(true);
                onToggle(type, id)
                    .finally(() => setLoading(false));
            };

            return e('button', {
                type: 'button',
                onClick: handleClick,
                className: `p-2 rounded-full transition-all duration-200 ${isFavorited
                    ? 'bg-red-500/10 text-red-500 hover:bg-red-500/20'
                    : 'bg-gray-700 text-gray-400 hover:bg-gray-600 hover:text-white'
                    }`,
                title: isFavorited ? 'Remove from favorites' : 'Add to favorites'
            },
                loading
                    ? e('div', { className: 'w-5 h-5 border-2 border-current border-t-transparent rounded-full animate-spin' })
                    : e('svg', {
                        xmlns: "http://www.w3.org/2000/svg",
                        width: "24",
                        height: "24",
                        viewBox: "0 0 24 24",
                        fill: isFavorited ? "currentColor" : "none",
                        stroke: "currentColor",
                        strokeWidth: "2",
                        strokeLinecap: "round",
                        strokeLinejoin: "round",
                        className: `w-5 h-5 ${isFavorited ? 'text-red-500' : ''}` // Ensure red color when filled
                    }, e('path', { d: "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" }))
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                this.setState({ error, errorInfo });
                console.error("Uncaught error:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return e('div', { className: 'p-8 text-white bg-red-900 min-h-screen' },
                        e('h1', { className: 'text-2xl font-bold mb-4' }, 'Something went wrong.'),
                        e('details', { className: 'whitespace-pre-wrap font-mono text-sm' },
                            this.state.error && this.state.error.toString(),
                            e('br'),
                            this.state.errorInfo && this.state.errorInfo.componentStack
                        )
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.render(e(ErrorBoundary, null, e(App)), document.getElementById('root'));
    </script>
</body>

</html>
