<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SafeLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #111827;
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>

<body class="text-white min-h-screen">
    <div id="root"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // lucide.createIcons(); // Removed this top-level call
        });

        const e = React.createElement;
        const { useState, useEffect } = React;

        const LucideIcon = ({ name, className, size = 20 }) => {
            return e('i', {
                'data-lucide': name,
                className: `${className}`,
                style: { width: size, height: size }
            });
        };

        const renderTextWithLinks = (text) => {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const parts = text.split(urlRegex);
            return parts.map((part, index) => {
                if (part.match(urlRegex)) {
                    return e('a', { key: index, href: part, target: '_blank', rel: 'noopener noreferrer', className: 'text-indigo-400 hover:text-indigo-300 underline' }, part);
                }
                return part;
            });
        };

        function AdminDashboard() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [posts, setPosts] = useState([]);
            const [bursaries, setBursaries] = useState([]);
            const [learnerships, setLearnerships] = useState([]);
            const [accommodations, setAccommodations] = useState([]);

            const fetchPosts = () => fetch('/api/posts').then(res => res.json()).then(setPosts).catch(console.error);
            const fetchBursaries = () => fetch('/api/bursaries').then(res => res.json()).then(setBursaries).catch(console.error);
            const fetchLearnerships = () => fetch('/api/learnerships').then(res => res.json()).then(setLearnerships).catch(console.error);
            const fetchAccommodations = () => fetch('/api/accommodations').then(res => res.json()).then(data => {
                const flatList = Object.values(data).flat();
                setAccommodations(flatList);
            }).catch(console.error);

            useEffect(() => {
                fetchPosts();
                fetchBursaries();
                fetchLearnerships();
                fetchAccommodations();
            }, []);

            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }, 50);
                return () => clearTimeout(timer);
            }, [activeTab, posts, bursaries, learnerships, accommodations]);

            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard': return e(Dashboard);
                    case 'bursaries': return e(BursariesManager, { bursaries, onBursaryChange: fetchBursaries });
                    case 'learnerships': return e(LearnershipsManager, { learnerships, onLearnershipChange: fetchLearnerships });
                    case 'posts': return e(PostsManager, { posts, onPostChange: fetchPosts });
                    case 'accommodations': return e(AccommodationsManager, { accommodations, onAccommodationChange: fetchAccommodations });
                    case 'messages': return e(MessagesManager);
                    default: return null;
                }
            };

            const tabButtonClass = (tabName) => `py-2 px-6 rounded-lg font-medium transition-all ${activeTab === tabName ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`;

            return e('div', { className: 'min-h-screen flex flex-col' },
                e(Header),
                e('main', { className: 'flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in' },
                    e('div', { className: 'overflow-x-auto mb-8' },
                        e('div', { className: 'flex gap-2 p-1 bg-gray-800/50 rounded-xl border border-gray-700 w-fit' },
                            e('button', { onClick: () => setActiveTab('dashboard'), className: tabButtonClass('dashboard') }, 'Dashboard'),
                            e('button', { onClick: () => setActiveTab('bursaries'), className: tabButtonClass('bursaries') }, 'Bursaries'),
                            e('button', { onClick: () => setActiveTab('learnerships'), className: tabButtonClass('learnerships') }, 'Learnerships'),
                            e('button', { onClick: () => setActiveTab('posts'), className: tabButtonClass('posts') }, 'Posts'),
                            e('button', { onClick: () => setActiveTab('accommodations'), className: tabButtonClass('accommodations') }, 'Accommodations'),
                            e('button', { onClick: () => setActiveTab('messages'), className: tabButtonClass('messages') }, 'Messages')
                        )
                    ),
                    renderContent()
                )
            );
        }

        const MessagesManager = () => {
            const [messages, setMessages] = useState([]);
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filter, setFilter] = useState('all');
            const [selectedMessage, setSelectedMessage] = useState(null);
            const [reply, setReply] = useState({ recipient_id: '', subject: '', message: '' });
            const [status, setStatus] = useState(null);
            const [view, setView] = useState('inbox'); // 'inbox' or 'compose'

            const fetchMessages = (currentFilter) => {
                setLoading(true);
                fetch(`/api/admin/messages?filter=${currentFilter}`)
                    .then(res => res.json())
                    .then(data => {
                        setMessages(data);
                        setLoading(false);
                    })
                    .catch(error => {
                        console.error('Error fetching messages:', error);
                        setLoading(false);
                    });
            };

            const fetchUsers = () => {
                fetch('/api/users/list')
                    .then(res => res.json())
                    .then(setUsers)
                    .catch(console.error);
            };

            useEffect(() => {
                if (view === 'inbox') {
                    fetchMessages(filter);
                }
                fetchUsers();
            }, [filter, view]);


            const handleFilterChange = (newFilter) => {
                setFilter(newFilter);
            };

            const handleMarkAsRead = (messageId, isRead) => {
                fetch(`/api/admin/messages/${messageId}/read`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_read: isRead })
                }).then(() => fetchMessages(filter));
            };

            const handleReplyChange = (field, value) => {
                setReply(prev => ({ ...prev, [field]: value }));
            };
            
            const handleSelectMessage = (msg) => {
                setView('inbox');
                setSelectedMessage(msg);
                if (msg.sender_id) { // Pre-fill reply form for user messages
                    setReply({
                        recipient_id: msg.sender_id,
                        subject: `Re: ${msg.subject}`,
                        message: `\n\n--- Original Message ---\n${msg.message}`
                    });
                } else { // Clear for contact form messages
                     setReply({
                        recipient_id: '',
                        subject: `Re: ${msg.subject}`,
                        message: `\n\n--- Original Message ---\n${msg.message}`
                    });
                }
            };

            const handleSendReply = (e) => {
                e.preventDefault();
                setStatus({ message: 'Sending...', type: 'info' });
                fetch('/api/admin/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reply)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        setStatus({ message: 'Message sent!', type: 'success' });
                        setReply({ recipient_id: '', subject: '', message: '' });
                    } else {
                        setStatus({ message: data.error || 'Failed to send message.', type: 'error' });
                    }
                    setTimeout(() => setStatus(null), 4000);
                })
                .catch(err => {
                    setStatus({ message: 'Error: ' + err, type: 'error' });
                    setTimeout(() => setStatus(null), 4000);
                });
            };
            
            const filterButtonClass = (filterName) => `px-4 py-2 text-sm rounded-lg font-medium transition-colors ${filter === filterName ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`;

            const InboxView = () => e('div', { className: 'lg:col-span-1 space-y-4' },
                e('div', {className: 'flex justify-between items-center'},
                    e('h2', { className: 'text-2xl font-bold flex items-center gap-3' },
                        e(LucideIcon, { name: 'mail', className: 'text-indigo-400', size: 24 }),
                        'Inbox'
                    ),
                    e('button', { onClick: () => setView('compose'), className: 'flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg font-medium text-sm transition-colors' },
                        e(LucideIcon, {name: 'edit', size: 16}),
                        'Compose'
                    )
                ),
                e('div', { className: 'flex gap-2' },
                    e('button', { onClick: () => handleFilterChange('all'), className: filterButtonClass('all') }, 'All'),
                    e('button', { onClick: () => handleFilterChange('unread'), className: filterButtonClass('unread') }, 'Unread'),
                    e('button', { onClick: () => handleFilterChange('contact'), className: filterButtonClass('contact') }, 'Contact'),
                    e('button', { onClick: () => handleFilterChange('user'), className: filterButtonClass('user') }, 'User')
                ),
                loading ? e('div', { className: 'text-center p-8' }, e('div', { className: 'w-8 h-8 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin mx-auto' }))
                    : messages.length === 0 
                        ? e('p', { className: 'text-gray-500 p-4 bg-gray-800 rounded-lg' }, 'No messages in this category.')
                        : e('div', { className: 'space-y-3' },
                            messages.map(msg => e('div', { 
                                key: msg.id, 
                                onClick: () => handleSelectMessage(msg),
                                className: `p-4 rounded-lg cursor-pointer border-2 ${selectedMessage && selectedMessage.id === msg.id ? 'border-indigo-500 bg-gray-800' : 'border-gray-700 bg-gray-900 hover:bg-gray-800'}` 
                            },
                                e('div', { className: 'flex justify-between items-start' },
                                    e('p', { className: 'font-bold' }, msg.sender_name || 'Anonymous'),
                                    !msg.is_read && e('span', { className: 'w-3 h-3 bg-indigo-500 rounded-full' })
                                ),
                                e('p', { className: 'text-sm text-indigo-400' }, msg.subject),
                                e('p', { className: 'text-xs text-gray-500 mt-2' }, new Date(msg.created_at).toLocaleString())
                            ))
                        )
            );

            const MessageDetailView = () => selectedMessage ? e('div', { className: 'glass-card p-6 rounded-2xl' },
                e('h3', { className: 'text-xl font-bold mb-4' }, selectedMessage.subject),
                e('div', { className: 'flex justify-between items-center mb-4 pb-4 border-b border-gray-700' },
                    e('div', null,
                        e('p', { className: 'text-white' }, e('strong', null, 'From: '), selectedMessage.sender_name),
                        e('p', { className: 'text-gray-400 text-sm' }, e('strong', null, 'Email: '), selectedMessage.sender_email || 'N/A')
                    ),
                    e('button', { onClick: () => handleMarkAsRead(selectedMessage.id, !selectedMessage.is_read), className: 'text-sm font-medium flex items-center gap-2 bg-gray-700 px-3 py-2 rounded-lg hover:bg-gray-600' }, 
                        e(LucideIcon, {name: selectedMessage.is_read ? 'mail-open' : 'mail', size: 16}),
                        selectedMessage.is_read ? 'Mark as Unread' : 'Mark as Read'
                    )
                ),
                e('div', { className: 'text-gray-300 mb-8 max-h-60 overflow-y-auto pr-2' }, e('p', { style: { whiteSpace: 'pre-wrap' } }, renderTextWithLinks(selectedMessage.message))),
                
                e('h4', { className: 'text-lg font-bold mt-8 mb-4 border-t border-gray-700 pt-6' }, 'Send a Message'),
                e('form', { onSubmit: handleSendReply, className: 'space-y-4' },
                   status && e('div', { className: `p-3 rounded-lg text-sm font-medium ${status.type === 'success' ? 'bg-green-500/10 text-green-300' : 'bg-red-500/10 text-red-300'}` }, status.message),
                   e('div', null, 
                        e('label', { className: 'block text-sm font-medium mb-1' }, 'Recipient'),
                        e('select', { 
                            name: 'recipient_id', 
                            value: reply.recipient_id,
                            onChange: (e) => handleReplyChange('recipient_id', e.target.value),
                            className: 'w-full bg-gray-900 border border-gray-700 rounded-xl p-3'
                         },
                            e('option', { value: '' }, 'Select a user...'),
                            users.map(user => e('option', { key: user.id, value: user.id }, `${user.username} (${user.email})`))
                        )
                   ),
                   e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Subject'), e(Input, { type: 'text', name: 'subject', value: reply.subject, onChange: (e) => handleReplyChange('subject', e.target.value), placeholder: 'Subject' })),
                   e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Message'), e('textarea', { name: 'message', value: reply.message, onChange: (e) => handleReplyChange('message', e.target.value), className: 'w-full bg-gray-900 border border-gray-700 rounded-xl p-3', rows: 5, placeholder: 'Your message...' })),
                   e(Button, { type: 'submit', className: 'bg-indigo-600 hover:bg-indigo-500 text-white w-full' }, 'Send Message')
                )

            ) : e('div', { className: 'flex items-center justify-center h-full glass-card rounded-2xl' },
                e('div', { className: 'text-center' },
                    e(LucideIcon, {name: 'mail', className: 'text-gray-600 mx-auto mb-4', size: 48 }),
                    e('p', { className: 'text-gray-500' }, 'Select a message to view its content.')
                )
            );

            const ComposeView = () => e('div', { className: 'lg:col-span-3' },
                e('div', { className: 'glass-card p-6 rounded-2xl' },
                    e('div', {className: 'flex justify-between items-center mb-6'},
                        e('h2', { className: 'text-2xl font-bold flex items-center gap-3' },
                            e(LucideIcon, { name: 'edit', className: 'text-green-400', size: 24 }),
                            'Compose Message'
                        ),
                        e('button', { onClick: () => setView('inbox'), className: 'flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-medium text-sm transition-colors' },
                            e(LucideIcon, {name: 'inbox', size: 16}),
                            'Back to Inbox'
                        )
                    ),
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                        e('div', { className: 'md:col-span-1' },
                            e('h3', { className: 'text-lg font-bold mb-4' }, 'Users'),
                            e('div', { className: 'space-y-2 max-h-96 overflow-y-auto' },
                                users.map(user => e('div', {
                                    key: user.id,
                                    onClick: () => handleReplyChange('recipient_id', user.id),
                                    className: `p-3 rounded-lg cursor-pointer ${reply.recipient_id == user.id ? 'bg-indigo-600 text-white' : 'bg-gray-800 hover:bg-gray-700'}`
                                },
                                    e('p', { className: 'font-bold' }, user.username),
                                    e('p', { className: 'text-sm' }, user.email)
                                ))
                            )
                        ),
                        e('div', { className: 'md:col-span-2' },
                             e('form', { onSubmit: handleSendReply, className: 'space-y-4' },
                                status && e('div', { className: `p-3 rounded-lg text-sm font-medium ${status.type === 'success' ? 'bg-green-500/10 text-green-300' : 'bg-red-500/10 text-red-300'}` }, status.message),
                               e('div', null, 
                                    e('label', { className: 'block text-sm font-medium mb-1' }, 'Recipient'),
                                    e('select', { 
                                        name: 'recipient_id', 
                                        value: reply.recipient_id,
                                        onChange: (e) => handleReplyChange('recipient_id', e.target.value),
                                        className: 'w-full bg-gray-900 border border-gray-700 rounded-xl p-3'
                                     },
                                        e('option', { value: '' }, 'Select a user...'),
                                        users.map(user => e('option', { key: user.id, value: user.id }, `${user.username} (${user.email})`))
                                    )
                               ),
                               e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Subject'), e(Input, { type: 'text', name: 'subject', value: reply.subject, onChange: (e) => handleReplyChange('subject', e.target.value), placeholder: 'Subject' })),
                               e('div', null, e('label', { className: 'block text-sm font-medium mb-1' }, 'Message'), e('textarea', { name: 'message', value: reply.message, onChange: (e) => handleReplyChange('message', e.target.value), className: 'w-full bg-gray-900 border border-gray-700 rounded-xl p-3', rows: 8, placeholder: 'Your message...' })),
                               e(Button, { type: 'submit', className: 'bg-green-600 hover:bg-green-500 text-white w-full' }, 'Send Message')
                            )
                        )
                    )
                )
            );

            return e('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-8' },
                view === 'inbox' ? e(InboxView) : null,
                view === 'inbox' ? e('div', { className: 'lg:col-span-2' }, e(MessageDetailView)) : e(ComposeView)
            );
        };
        
        const Dashboard = () => {
            const [stats, setStats] = useState(null);

            useEffect(() => {
                fetch('/api/stats')
                    .then(res => res.json())
                    .then(setStats)
                    .catch(console.error);
            }, []);

            if (!stats) return e('div', { className: 'flex justify-center p-20' }, e('div', { className: 'w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin' }));

            const StatCard = ({ title, value, icon, color }) => e('div', { className: 'glass-card p-6 rounded-2xl flex items-center gap-4' },
                e('div', { className: `p-4 rounded-xl ${color} bg-opacity-10` }, e(LucideIcon, { name: icon, className: `${color.replace('bg-', 'text-')}`, size: 32 })),
                e('div', null,
                    e('p', { className: 'text-gray-400 text-sm font-medium' }, title),
                    e('p', { className: 'text-3xl font-bold' }, value)
                )
            );

            return e('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6' },
                e(StatCard, { title: 'Total Users', value: stats.total_users, icon: 'users', color: 'bg-blue-500' }),
                e(StatCard, { title: 'Bursaries', value: stats.total_bursaries, icon: 'graduation-cap', color: 'bg-green-500' }),
                e(StatCard, { title: 'Learnerships', value: stats.total_learnerships, icon: 'briefcase', color: 'bg-yellow-500' }),
                e(StatCard, { title: 'Accommodations', value: stats.total_accommodations, icon: 'home', color: 'bg-purple-500' }),
                e(StatCard, { title: 'Qualifications', value: stats.total_qualifications, icon: 'award', color: 'bg-indigo-500' }),
                e(StatCard, { title: 'Skills Programmes', value: stats.total_skills_programmes, icon: 'star', color: 'bg-pink-500' }),
                e(StatCard, { title: 'Accredited Schools', value: stats.total_accredited_schools, icon: 'building-2', color: 'bg-teal-500' })
            );
        };

        const Input = (props) => e('input', { ...props, className: `w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all ${props.className || ''}` });
        const Button = ({ children, className, ...props }) => e('button', { ...props, className: `px-6 py-3 rounded-xl font-bold transition-all shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 ${className}` }, children);

        const AccommodationsManager = ({ accommodations, onAccommodationChange }) => {
            const [editingId, setEditingId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [status, setStatus] = useState(null);
            const formRef = React.useRef();

            const startEdit = (acc) => {
                setEditingId(acc.id);
                const form = formRef.current;
                form.accommodation_name.value = acc.accommodation_name;
                form.suburb.value = acc.suburb;
                form.city.value = acc.city;
                form.province.value = acc.province || '';
                form.monthly_pay.value = acc.monthly_pay;
                form.payment_nsfas.value = acc.payment_nsfas;
                form.payment_bursary.value = acc.payment_bursary;
                form.payment_cash.value = acc.payment_cash;
                window.scrollTo({ top: form.offsetTop - 100, behavior: 'smooth' });
            };

            const onSubmit = (ev) => {
                ev.preventDefault();
                const formData = new FormData(ev.target);
                const url = editingId ? `/api/accommodations/${editingId}` : '/api/accommodations';
                fetch(url, { method: 'POST', body: formData }).then(() => {
                    onAccommodationChange();
                    ev.target.reset();
                    setEditingId(null);
                    setStatus({ message: editingId ? 'Accommodation updated!' : 'Accommodation added!', type: 'success' });
                    setTimeout(() => setStatus(null), 3000);
                }).catch(err => {
                    setStatus({ message: 'Error: ' + err.message, type: 'error' });
                    setTimeout(() => setStatus(null), 5000);
                });
            };

            const filtered = accommodations.filter(acc =>
                acc.accommodation_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                acc.city.toLowerCase().includes(searchTerm.toLowerCase()) ||
                acc.suburb.toLowerCase().includes(searchTerm.toLowerCase()) ||
                acc.province.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return e('div', { className: 'glass-card rounded-2xl p-8' },
                e('h2', { className: 'text-2xl font-bold mb-6 flex items-center gap-3' },
                    e(LucideIcon, { name: 'home', className: 'text-indigo-400', size: 24 }),
                    editingId ? 'Edit Accommodation' : 'Manage Accommodations'
                ),
                e('form', { ref: formRef, onSubmit, className: 'grid gap-6 mb-8' },
                    status && e('div', { className: `p-4 rounded-xl text-sm font-medium ${status.type === 'success' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}` }, status.message),
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                        e(Input, { type: 'text', name: 'accommodation_name', placeholder: 'Accommodation Name', required: true }),
                        e(Input, { type: 'text', name: 'suburb', placeholder: 'Suburb', required: true }),
                        e(Input, { type: 'text', name: 'city', placeholder: 'City', required: true }),
                        e(Input, { type: 'text', name: 'province', placeholder: 'Province (e.g. Gauteng)', required: true }),
                        e(Input, { type: 'number', name: 'monthly_pay', placeholder: 'Monthly Pay' }),
                        e(Input, { type: 'text', name: 'payment_nsfas', placeholder: 'Accepts NSFAS (Yes/No)' }),
                        e(Input, { type: 'text', name: 'payment_bursary', placeholder: 'Accepts Bursary (Yes/No)' }),
                        e(Input, { type: 'text', name: 'payment_cash', placeholder: 'Accepts Cash (Yes/No)' }),
                    ),
                    e('div', { className: 'flex gap-4' },
                        e(Button, { type: 'submit', className: 'bg-indigo-600 hover:bg-indigo-500 text-white flex-1' }, editingId ? 'Update Accommodation' : 'Add Accommodation'),
                        editingId && e(Button, { type: 'button', onClick: () => { setEditingId(null); formRef.current.reset(); }, className: 'bg-gray-700 hover:bg-gray-600 text-white' }, 'Cancel')
                    )
                ),
                e('div', { className: 'mb-4 relative' },
                    e('div', { className: 'absolute left-3 top-3' }, e(LucideIcon, { name: 'search', className: 'text-gray-400', size: 20 })),
                    e(Input, {
                        type: 'text',
                        placeholder: 'Search accommodations...',
                        value: searchTerm,
                        onChange: (e) => setSearchTerm(e.target.value),
                        className: 'pl-10'

                            e('div', { className: 'flex items-center gap-4' },
                                e('button', { onClick: () => setIsEditing(true), className: 'flex items-center gap-1 text-sm text-gray-400 hover:text-white transition-colors' }, e(LucideIcon, { name: 'edit', size: 16 }), 'Edit'),
                                e('button', { onClick: handleDelete, className: 'flex items-center gap-1 text-sm text-red-400 hover:text-red-300 transition-colors' }, e(LucideIcon, { name: 'trash', size: 16 }), 'Delete')
                            )
                        ),
                        showComments && e('div', { className: 'mt-6 bg-gray-900/30 rounded-xl p-4 border border-gray-700' },
                            e('h4', { className: 'text-sm font-bold text-gray-400 mb-4 uppercase tracking-wider' }, 'Comments'),
                            e('div', { className: 'space-y-4 max-h-64 overflow-y-auto mb-4 custom-scrollbar' },
                                comments.map(comment => e(Comment, { key: comment.id, comment, post, onCommentPosted: fetchComments }))
                            ),
                            e('form', { onSubmit: handleCommentSubmit, className: 'flex items-center gap-3' },
                                e('input', {
                                    type: 'text', placeholder: 'Write a comment...', value: newComment, onChange: (e) => setNewComment(e.target.value),
                                    className: 'flex-grow p-3 bg-gray-800 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition-colors'
                                }),
                                e('button', { type: 'submit', className: 'p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition-colors' }, e(LucideIcon, { name: 'send', size: 20 }))
                            )
                        )
                    )
            );
        };

        ReactDOM.render(e(AdminDashboard), document.getElementById('root'));
    </script>
</body>

</html>
