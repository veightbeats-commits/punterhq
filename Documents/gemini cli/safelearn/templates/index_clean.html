            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const parts = text.split(urlRegex);
            return parts.map((part, index) => {
                if (part.match(urlRegex)) {
                    return e('a', { key: index, href: part, target: '_blank', rel: 'noopener noreferrer', className: 'text-blue-500 hover:underline' }, part);
                }
                return part;
            });

        const TabButton = ({ label, icon, activeTab, setActiveTab, tabName, isMobile }) => {
            const isActive = activeTab === tabName;

        const NewsTab = () => {
            const [posts, setPosts] = useState([]);

            useEffect(() => {
                fetch('/api/posts')
                    .then(res => res.json())
                    .then(data => setPosts(data))
                    .catch(console.error);
            }, []);

            return e('div', { className: 'space-y-6' },

        };
        
        const Comment = ({ comment, post, onCommentPosted }) => {
            const [showReplyForm, setShowReplyForm] = useState(false);
            const [reply, setReply] = useState('');

            const handleReplySubmit = (e) => {
                e.preventDefault();
                if (reply.trim()) {
                    fetch(`/api/posts/${post.id}/comment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comment: reply, parent_id: comment.id })
                    })
                    .then(() => {
                        setReply('');
                        setShowReplyForm(false);
                        onCommentPosted(); // Callback to refresh comments
                    })
                    .catch(console.error);
                }
            };
            
            return e('div', { className: 'ml-4 mt-2' },
                e('div', { className: 'text-sm bg-gray-100 p-3 rounded-lg' },
                    e('p', null, renderTextWithLinks(comment.comment)),
                    e('span', { className: 'text-xs text-gray-500' }, new Date(comment.created_at).toLocaleString()),

        const PostCard = ({ post }) => {
            const [likes, setLikes] = useState(post.likes);
            const [comments, setComments] = useState([]);
            const [showComments, setShowComments] = useState(false);
            const [newComment, setNewComment] = useState('');

            const fetchComments = () => {
                fetch(`/api/posts/${post.id}/comments`)
                    .then(res => res.json())
                    .then(data => {
                        const commentsById = {};
                        data.forEach(comment => commentsById[comment.id] = { ...comment, children: [] });
                        
                        const nestedComments = [];
                        data.forEach(comment => {
                            if (comment.parent_id && commentsById[comment.parent_id]) {
                                commentsById[comment.parent_id].children.push(commentsById[comment.id]);
                            } else {
                                nestedComments.push(commentsById[comment.id]);
                            }
                        });
                        setComments(nestedComments);
                    })
                    .catch(console.error);
            };

            useEffect(() => {
                if (showComments) {
                    fetchComments();
                }
            }, [showComments, post.id]);

            const handleLike = () => {
                const likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');
                if (!likedPosts.includes(post.id)) {
                    fetch(`/api/posts/${post.id}/like`, { method: 'POST' })
                        .then(() => {
                            setLikes(likes + 1);
                            localStorage.setItem('likedPosts', JSON.stringify([...likedPosts, post.id]));
                        })
                        .catch(console.error);
                } else {
                    alert('You have already liked this post.');
                }
            };

            const handleCommentSubmit = (e) => {
                e.preventDefault();
                if (newComment.trim()) {
                    fetch(`/api/posts/${post.id}/comment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comment: newComment })
                    })
                    .then(() => {
                        setNewComment('');
                        fetchComments(); // Refresh comments
                    })
                    .catch(console.error);
                }
            };

            return e('div', { className: 'bg-white border border-gray-200 shadow-sm' },
                post.image_path && e('div', { className: 'w-full h-64 bg-gray-100' }, 
                                    e('img', { src: `/${post.image_path}`, className: 'w-full h-full object-cover' })),
                e('div', { className: 'p-6' },
                    e('h3', { className: 'text-xl font-bold' }, renderTextWithLinks(post.title)),
                    e('p', { className: 'mt-2 text-gray-800' }, renderTextWithLinks(post.content)),
                    e('div', { className: 'flex items-center justify-between mt-4 text-sm text-gray-500' },
                        e('span', null, new Date(post.created_at).toLocaleString()),
                        e('div', { className: 'flex items-center gap-4' },
                            e('button', { onClick: handleLike, className: 'flex items-center gap-1 hover:text-blue-600' }, e('i', { 'data-lucide': 'thumbs-up', className: 'w-4 h-4' }), likes),
                            e('button', { onClick: () => setShowComments(!showComments), className: 'flex items-center gap-1 hover:text-blue-600' }, e('i', { 'data-lucide': 'message-square', className: 'w-4 h-4' }), 'Comment')
                        )
                    )
                ),
                showComments && e('div', { className: 'p-6 border-t' },
                    e('h4', { className: 'text-lg font-semibold mb-4' }, 'Comments'),
                    e('div', { className: 'space-y-4' },
                        comments.map(comment => e(Comment, { key: comment.id, comment, post, onCommentPosted: fetchComments }))
                    ),
                    e('form', { onSubmit: handleCommentSubmit, className: 'mt-6' },
                        e('div', { className: 'flex items-center gap-2' },
                            e('input', {

                            e('button', { type: 'submit', className: 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg' }, 'Post')

            );
        };

        const SearchResults = ({ results }) => {
            if (results.length === 0) {
                return e('div', { className: 'mt-8 text-center text-gray-500' }, 'No results to display. Start a search to see qualifications, skills, or schools.');
            }

            const qualifications = results.filter(r => r.type === 'qualification');
            const skillProgrammes = results.filter(r => r.type === 'skill_programme');
            const schools = results.filter(r => r.type === 'school');

            return e('div', { className: 'mt-6 space-y-8' },
                qualifications.length > 0 && e('div', { className: 'p-6 bg-blue-50 rounded-lg' },
                    e('h2', { className: 'text-xl font-bold text-blue-800 mb-4' }, 'Qualifications'),
                    e('div', { className: 'space-y-4' }, qualifications.map(item => e(ResultCard, { key: item.id, item })))
                ),
                skillProgrammes.length > 0 && e('div', { className: 'p-6 bg-yellow-50 rounded-lg' },
                    e('h2', { className: 'text-xl font-bold text-yellow-800 mb-4' }, 'Skill Programmes'),
                    e('div', { className: 'space-y-4' }, skillProgrammes.map(item => e(ResultCard, { key: item.id, item })))
                ),
                schools.length > 0 && e('div', { className: 'p-6 bg-green-50 rounded-lg' },
                    e('h2', { className: 'text-xl font-bold text-green-800 mb-4' }, 'Accredited Schools'),
                    e('div', { className: 'space-y-4' }, schools.map(item => e(ResultCard, { key: item.id, item })))
                )

        };
        
        const SchoolResults = ({ results }) => {
            if (results.length === 0) {
                return e('div', { className: 'mt-8 text-center text-gray-500' }, 'Search for a provider to verify their accreditation status.');
            }
            return e('div', { className: 'mt-6 space-y-4' },
                results.map(item => e(SchoolCard, { key: item.id, item }))
            );
        };

        const ResultCard = ({ item }) => {
            const typeInfo = {
                qualification: { icon: 'award', color: 'blue', bgColor: 'bg-blue-100', textColor: 'text-blue-600', tagColor: 'text-blue-800' },
                skill_programme: { icon: 'star', color: 'yellow', bgColor: 'bg-yellow-100', textColor: 'text-yellow-600', tagColor: 'text-yellow-800' },
                school: { icon: 'building-2', color: 'green', bgColor: 'bg-green-100', textColor: 'text-green-600', tagColor: 'text-green-800' }

            // Reviews and Favorites temporarily disabled for debugging
            // const [showReviews, setShowReviews] = useState(false);
            // const [refreshReviews, setRefreshReviews] = useState(0); 
            // const [isFavorited, setIsFavorited] = useState(false);
            // useEffect(() => { /* ... */ }, [session.user_id, item.id, item.type]);
            // const handleFavoriteToggle = async () => { /* ... */ };

            return e('div', { className: 'bg-white border border-gray-200 rounded-lg p-6 shadow-sm hover:shadow-md transition-shadow' },
                e('div', { className: 'flex items-start gap-4' },
                    e('div', { className: `flex-shrink-0 w-10 h-10 rounded-lg ${info.bgColor} flex items-center justify-center` },
                        e('i', { 'data-lucide': info.icon, className: `w-6 h-6 ${info.textColor}` })
                    ),
                    e('div', { className: 'flex-1' },
                        e('div', { className: 'flex justify-between' },
                            e('h3', { className: 'text-lg font-semibold text-gray-900' }, renderTextWithLinks(item.title)),
                            e('div', { className: 'flex items-center gap-2' },
                                e('span', { className: `text-xs font-medium capitalize px-2 py-1 rounded-full ${info.bgColor} ${info.tagColor}` }, item.type.replace('_', ' ')),
                                // session.user_id && e('button', { onClick: handleFavoriteToggle, className: 'text-gray-400 hover:text-red-500' },
                                //     e('i', { 'data-lucide': isFavorited ? 'heart' : 'heart', className: `w-5 h-5 ${isFavorited ? 'fill-red-500 text-red-500' : ''}` })
                                // )
                            )
                        ),
                        item.nqf_level && e('p', { className: 'text-sm text-gray-600 mt-1' }, `NQF Level: ${item.nqf_level} · Credits: ${item.credits || 'N/A'}`),
                        item.city && e('p', { className: 'text-sm text-gray-600 mt-1' }, `${item.city}, ${item.province}`),
                        item.type === 'qualification' && e('button', {

                // Reviews Section Temporarily Disabled
                // e('div', { className: 'mt-4 pt-4 border-t border-gray-200' },
                //     e('button', { onClick: () => setShowReviews(!showReviews), className: 'text-blue-600 hover:underline text-sm flex items-center gap-1' }, e('i', { 'data-lucide': showReviews ? 'chevron-up' : 'chevron-down', className: 'w-4 h-4' }), showReviews ? 'Hide Reviews' : 'Show Reviews'),

                // )
            );
        };
        
        const SchoolCard = ({ item }) => {

            const [refreshReviews, setRefreshReviews] = useState(0); // State to trigger review refresh
            const [isFavorited, setIsFavorited] = useState(false);

            useEffect(() => {
                if (session.user_id) {
                    fetch(`/api/users/${session.user_id}/favorites`)

                        .then(data => {

                            setIsFavorited(favorited);

                }

            const handleFavoriteToggle = async () => {
                if (!session.user_id) {
                    alert('Please log in to favorite items.');
                    return;
                }

                const url = '/api/favorites';
                const method = isFavorited ? 'DELETE' : 'POST';
                const body = { item_id: String(item.id), item_type: 'school' };

                try {
                    const response = await fetch(isFavorited ? `${url}/school/${item.id}` : url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',

                        body: isFavorited ? null : JSON.stringify(body),
                    });

                    if (response.ok) {
                        setIsFavorited(!isFavorited);
                    } else {
                        const errorData = await response.json();

                    console.error('Error toggling favorite:', error);

                        e('p', { className: 'text-sm text-gray-600 mt-1' }, `Acc. Number: ${item.accreditation_number}`),

                    )
                ),
                e('div', { className: 'mt-4 pt-4 border-t border-gray-200' },
                    e('button', {
                        onClick: () => setShowReviews(!showReviews),
                        className: 'text-blue-600 hover:underline text-sm flex items-center gap-1'
                    },
                        e('i', { 'data-lucide': showReviews ? 'chevron-up' : 'chevron-down', className: 'w-4 h-4' }),

                    ),
                    showReviews && e('div', null,
                        e(ReviewList, { key: `review-list-${item.id}-${refreshReviews}`, itemId: item.id, itemType: 'school' }),
                        e(ReviewForm, { key: `review-form-${item.id}`, itemId: item.id, itemType: 'school', onReviewSubmitted: () => setRefreshReviews(prev => prev + 1) })
                    )
                )
            );
        };

        const AccommodationTab = () => {
            const [accommodations, setAccommodations] = useState({});
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetch('/api/accommodations')
                    .then(res => res.json())
                    .then(data => {
                        setAccommodations(data);
                        setLoading(false);
                    })
                    .catch(error => {
                        console.error('Error fetching accommodations:', error);
                        setLoading(false);
                    });
            }, []);

            useEffect(() => {
                if (!loading) {
                    lucide.createIcons();
                }
            }, [loading]);

            if (loading) {
                return e('div', { className: 'text-center p-8' }, 'Loading...');
            }

            return e('div', { className: 'space-y-8' },
                Object.keys(accommodations).sort().map(city =>
                    e('div', { key: city, className: 'p-6 bg-gray-100 rounded-lg' },
                        e('h2', { className: 'text-2xl font-bold text-gray-800 mb-4' }, city),
                        e('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6' },
                            accommodations[city].map(item => e(AccommodationCard, { key: item.id, item }))
                        )
                    )
                )
            );
        };

        const AccommodationCard = ({ item }) => {
            const [showReviews, setShowReviews] = useState(false);
            const [refreshReviews, setRefreshReviews] = useState(0); // State to trigger review refresh
            const [isFavorited, setIsFavorited] = useState(false);

            useEffect(() => {
                if (session.user_id) {
                    fetch(`/api/users/${session.user_id}/favorites`)
                        .then(res => res.json())
                        .then(data => {
                            const favorited = data.some(fav => fav.item_id === String(item.id) && fav.item_type === 'accommodation');
                            setIsFavorited(favorited);
                        })
                        .catch(console.error);
                }
            }, [session.user_id, item.id]);

            const handleFavoriteToggle = async () => {
                if (!session.user_id) {
                    alert('Please log in to favorite items.');
                    return;
                }

                const url = '/api/favorites';
                const method = isFavorited ? 'DELETE' : 'POST';
                const body = { item_id: String(item.id), item_type: 'accommodation' };

                try {
                    const response = await fetch(isFavorited ? `${url}/accommodation/${item.id}` : url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: isFavorited ? null : JSON.stringify(body),
                    });

                    if (response.ok) {
                        setIsFavorited(!isFavorited);
                    } else {
                        const errorData = await response.json();
                        alert(errorData.message || 'Failed to toggle favorite.');
                    }
                } catch (error) {
                    console.error('Error toggling favorite:', error);
                    alert('An error occurred while toggling favorite.');
                }

            return e('div', { className: 'bg-white border border-gray-200 rounded-lg p-6 shadow-sm flex flex-col' },
                e('div', { className: 'flex items-center justify-between' },
                    e('h3', { className: 'text-lg font-semibold text-gray-900' }, item.accommodation_name),
                    e('div', { className: 'flex items-center gap-2' },
                        e('i', { 'data-lucide': 'badge-check', className: 'w-5 h-5 text-blue-500' }),
                        session.user_id && e('button', { onClick: handleFavoriteToggle, className: 'text-gray-400 hover:text-red-500' },
                            e('i', { 'data-lucide': isFavorited ? 'heart' : 'heart', className: `w-5 h-5 ${isFavorited ? 'fill-red-500 text-red-500' : ''}` })
                        )
                    )
                ),
                e('div', { className: 'mt-1' },
                    e('p', { className: 'text-sm text-gray-600 flex items-center gap-2' },
                        e('i', { 'data-lucide': 'map-pin', className: 'w-4 h-4 text-gray-500' }),
                        item.suburb
                    )
                ),
                e('div', { className: 'mt-4' },
                    e('p', { className: 'text-md font-bold text-gray-800' }, `R ${item.monthly_pay} / month`),
                    e('div', { className: 'flex flex-wrap gap-2 mt-2' },
                        item.payment_nsfas === 'Yes' && e('span', { className: 'text-xs font-medium px-2 py-1 rounded-full bg-blue-100 text-blue-800' }, 'NSFAS'),
                        item.payment_bursary === 'Yes' && e('span', { className: 'text-xs font-medium px-2 py-1 rounded-full bg-green-100 text-green-800' }, 'Bursary'),
                        item.payment_cash === 'Yes' && e('span', { className: 'text-xs font-medium px-2 py-1 rounded-full bg-yellow-100 text-yellow-800' }, 'Cash')
                    )
                ),
                e('div', { className: 'mt-4 pt-4 border-t border-gray-200' },
                    e('button', {
                        onClick: () => setShowReviews(!showReviews),
                        className: 'text-blue-600 hover:underline text-sm flex items-center gap-1'
                    },
                        e('i', { 'data-lucide': showReviews ? 'chevron-up' : 'chevron-down', className: 'w-4 h-4' }),

                    showReviews && e('div', null,

                        e(ReviewForm, { key: `review-form-${item.id}`, itemId: item.id, itemType: 'accommodation', onReviewSubmitted: () => setRefreshReviews(prev => prev + 1) })
                    )
                )

        };

        const Header = ({isMenuOpen, setIsMenuOpen, activeTab, setActiveTab}) => {
            const isLoggedIn = session && session.user_id;

            const authLinks = () => {
                if (isLoggedIn) {
                    return [
                        e('a', { key: 'profile', href: '/profile', className: 'text-sm font-medium text-gray-700 hover:text-blue-600' }, 'Profile'),
                        e('a', { key: 'logout', href: '/api/logout', className: 'text-sm font-medium text-gray-700 hover:text-blue-600' }, 'Logout')

                }
                return [
                    e('a', { key: 'login', href: '/login', className: 'text-sm font-medium text-gray-700 hover:text-blue-600' }, 'Login'),
                    e('a', { key: 'register', href: '/register', className: 'bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700' }, 'Register')
                ];

            return e('header', { className: 'bg-white shadow-sm sticky top-0 z-50' },
                e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },

                        e('a', { href: '/', className: 'flex items-center gap-2 cursor-pointer' },
                            e('i', { 'data-lucide': 'feather', className: 'w-8 h-8 text-blue-600' }),
                            e('span', { className: 'text-xl font-bold text-gray-900' }, 'SafeLearn')

                        e('div', { className: 'hidden sm:flex sm:items-center sm:space-x-4' },
                            e(TabButton, { label: 'Qualifications', icon: 'search', activeTab, setActiveTab, tabName: 'search', isMobile: false }),
                            e(TabButton, { label: 'Verify Provider', icon: 'shield-check', activeTab, setActiveTab, tabName: 'verify', isMobile: false }),
                            e(TabButton, { label: 'SETAs', icon: 'briefcase', activeTab, setActiveTab, tabName: 'setas', isMobile: false }),
                            e(TabButton, { label: 'Bursaries', icon: 'graduation-cap', activeTab, setActiveTab, tabName: 'bursaries', isMobile: false }),
                            e(TabButton, { label: 'Career Paths', icon: 'trending-up', activeTab, setActiveTab, tabName: 'career_paths', isMobile: false }),
                            e(TabButton, { label: 'Accommodation', icon: 'home', activeTab, setActiveTab, tabName: 'accommodation', isMobile: false }),
                            e(TabButton, { label: 'TVET Colleges', icon: 'building', activeTab, setActiveTab, tabName: 'tvet_colleges', isMobile: false }),
                            e(TabButton, { label: 'News', icon: 'newspaper', activeTab, setActiveTab, tabName: 'news', isMobile: false }),
                            e(TabButton, { label: 'Links', icon: 'book-open', activeTab, setActiveTab, tabName: 'materials', isMobile: false })
                        ),
                        e('div', { className: 'hidden sm:flex items-center space-x-4' }, ...authLinks()),

                                isMenuOpen ? e('i', { 'data-lucide': 'x', className: 'block h-6 w-6' }) : e('i', { 'data-lucide': 'menu', className: 'block h-6 w-6' })

                        e(TabButton, { label: 'Qualifications', icon: 'search', activeTab, setActiveTab, tabName: 'search', isMobile: true }),
                        e(TabButton, { label: 'Verify Provider', icon: 'shield-check', activeTab, setActiveTab, tabName: 'verify', isMobile: true }),
                        e(TabButton, { label: 'SETAs', icon: 'briefcase', activeTab, setActiveTab, tabName: 'setas', isMobile: true }),
                        e(TabButton, { label: 'Bursaries', icon: 'graduation-cap', activeTab, setActiveTab, tabName: 'bursaries', isMobile: true }),
                        e(TabButton, { label: 'Career Paths', icon: 'trending-up', activeTab, setActiveTab, tabName: 'career_paths', isMobile: true }),
                        e(TabButton, { label: 'Accommodation', icon: 'home', activeTab, setActiveTab, tabName: 'accommodation', isMobile: true }),
                        e(TabButton, { label: 'TVET Colleges', icon: 'building', activeTab, setActiveTab, tabName: 'tvet_colleges', isMobile: true }),
                        e(TabButton, { label: 'News', icon: 'newspaper', activeTab, setActiveTab, tabName: 'news', isMobile: true }),
                        e(TabButton, { label: 'Links', icon: 'book-open', activeTab, setActiveTab, tabName: 'materials', isMobile: true }),
                        // Add auth links to mobile menu too
                        e('div', { className: 'border-t border-gray-200 mt-2 pt-2 space-y-1' }, ...authLinks().map(link => e('a', { ...link.props, className: `${link.props.className} block px-3 py-2` })))
                    )
                )
            );
        };

        const Footer = () => {
            return e('footer', { className: 'bg-gray-800 text-white py-8 mt-12' },
                e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center' },
                    e('div', { className: 'mb-4' },
                        e('a', { href: '/', className: 'flex items-center justify-center gap-2 text-xl font-bold text-white hover:text-blue-400 transition-colors' },
                            e('i', { 'data-lucide': 'feather', className: 'w-6 h-6' }),
                            e('span', null, 'SafeLearn')
                        )
                    ),
                    e('div', { className: 'flex justify-center space-x-6 mb-6' },
                        e('a', { href: '#', className: 'text-gray-300 hover:text-white' }, 'About'),
                        e('a', { href: '#', className: 'text-gray-300 hover:text-white' }, 'Privacy Policy'),
                        e('a', { href: '#', className: 'text-gray-300 hover:text-white' }, 'Terms of Service')
                    ),
                    e('p', { className: 'text-gray-500 text-sm' }, '© 2023 SafeLearn. All rights reserved.')
                )
            );
        };

        ReactDOM.render(e(App), document.getElementById('root'));
    </script>
